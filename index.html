      font-weight: 600;
      font-family: inherit;

        max-width: 400px;
        align-self: center;
        width: 100%;
      }
    }

    function RadioGroup({ options, value, onChange, name }) {
      return (
        <div className="radio-group">
          {options.map((option, index) => (
            <label key={index} className={`radio-option ${value === option ? 'selected' : ''}`}>
              <input type="radio" name={name} value={option} checked={value === option} onChange={() => onChange(option)} />
              <span className="radio-circle" />
              <span className="radio-label">{option}</span>
            </label>
          ))}
        </div>
      );
    }

    function CheckboxGroup({ options, values, onChange, otherValue, onOtherChange, showOtherInput }) {
      const handleToggle = (optionId) => {
        if (values.includes(optionId)) {
          onChange(values.filter(v => v !== optionId));
        } else {
          onChange([...values, optionId]);
        }
      };

      return (
        <div className="checkbox-group">
          {options.map((option) => (
            <label key={option.id} className={`checkbox-card ${values.includes(option.id) ? 'selected' : ''}`}>
              <input type="checkbox" checked={values.includes(option.id)} onChange={() => handleToggle(option.id)} />
              <span className="checkbox-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </span>
              <div className="checkbox-with-input">
                <span className="checkbox-label">{option.label}</span>
                {showOtherInput && option.id === 'other' && values.includes('other') && (
                  <input
                    type="text"
                    className="checkbox-input"
                    value={otherValue || ''}
                    onChange={(e) => onOtherChange(e.target.value)}
                    placeholder="פרט..."
                    onClick={(e) => e.stopPropagation()}
                  />
                )}
              </div>
            </label>
          ))}
        </div>
      );
    }

              className={`form-textarea ${errors.main_frustration ? 'error' : ''}`}
              value={data.main_frustration || ''}
              onChange={(e) => onChange('main_frustration', e.target.value)}
              placeholder="תאר..."
              rows="4"
            />
            {errors.main_frustration && <div className="error-message">{errors.main_frustration}</div>}
          </div>

          <div className="question-card">
            <h3 className="question-title">האם יש משהו שאתה בטוח שאפשר לעשות אותו יותר מהר/טוב?</h3>
            <textarea
              className="form-textarea"
              value={data.improvement_idea || ''}
              onChange={(e) => onChange('improvement_idea', e.target.value)}
              placeholder="תאר את הרעיון שלך..."
              rows="3"
            />
          </div>

          <div className="question-card">
            <h3 className="question-title">איזה תהליך היית רוצה שיעבוד יותר חלק?</h3>
            <textarea
              className="form-textarea"
              value={data.process_wish || ''}
              onChange={(e) => onChange('process_wish', e.target.value)}
              placeholder="תאר..."
              rows="3"
            />
          </div>
        </>
      );
    }

    function StepProcessMapping({ data, onChange, errors, stepNum, totalSteps }) {
      return (
        <>
          <div className="step-header">
            <div className="step-indicator">שלב {stepNum} מתוך {totalSteps}</div>
            <h2 className="step-title">מיפוי תהליכי עבודה</h2>
            <p className="step-description">עזור לנו להבין את תהליכי העבודה שלך לעומק</p>
          </div>

          <div className="question-card">
            <h3 className="question-title">מאיפה מגיע המידע שאתה מעבד?</h3>
            <p className="question-hint">בחר את כל המקורות הרלוונטיים</p>
            <CheckboxGroup
              options={INFO_SOURCES}
              values={data.info_source}
              onChange={(values) => onChange('info_source', values)}
              otherValue={data.info_source_other}
              onOtherChange={(value) => onChange('info_source_other', value)}
              showOtherInput={true}
            />
          </div>

          <div className="question-card">
            <h3 className="question-title">היכן מזינים את המידע? (נקודת הזנה)</h3>
            <input
              type="text"
              className="form-input"
              value={data.data_entry_point || ''}
              onChange={(e) => onChange('data_entry_point', e.target.value)}
              placeholder="לדוגמה: אקסל, מערכת פנימית, אתר הנמל..."
            />
          </div>

          <div className="question-card">
            <h3 className="question-title">לאיזו מערכת מגיע המידע בסוף? (יעד סופי)</h3>
            <input
              type="text"
              className="form-input"
              value={data.final_destination_system || ''}
              onChange={(e) => onChange('final_destination_system', e.target.value)}
              placeholder="לדוגמה: מערכת הנהלת חשבונות, דוח ללקוח..."
            />
          </div>

          <div className="question-card">
            <h3 className="question-title">האם התהליך מבוסס על חוקים קבועים?</h3>
            <p className="question-hint">האם התהליך מתבצע באותה צורה בכל פעם?</p>
            <div className="radio-group">
              {PROCESS_TYPES.map((option) => (
                <label key={option.id} className={`radio-option ${data.process_type === option.id ? 'selected' : ''}`}>
                  <input
                    type="radio"
                    name="process_type"
                    value={option.id}
                    checked={data.process_type === option.id}
                    onChange={() => onChange('process_type', option.id)}
                  />
                  <span className="radio-circle" />
                  <span className="radio-label">{option.label}</span>
                </label>
              ))}
            </div>
            {errors.process_type && <div className="error-message">{errors.process_type}</div>}
          </div>

          <div className="question-card">
            <h3 className="question-title">באיזו תדירות אתה מבצע את התהליך?</h3>
            <div className="radio-group">
              {FREQUENCY_OPTIONS.map((option) => (
                <label key={option.id} className={`radio-option ${data.process_frequency === option.id ? 'selected' : ''}`}>
                  <input
                    type="radio"
                    name="process_frequency"
                    value={option.id}
                    checked={data.process_frequency === option.id}
                    onChange={() => onChange('process_frequency', option.id)}
                  />
                  <span className="radio-circle" />
                  <span className="radio-label">{option.label}</span>
                </label>
              ))}
            </div>
          </div>

          <div className="question-card">
            <h3 className="question-title">לאן מגיע המידע בסוף התהליך?</h3>
            <p className="question-hint">בחר את כל היעדים הרלוונטיים</p>
            <CheckboxGroup
              options={DESTINATIONS}
              values={data.destination}
              onChange={(values) => onChange('destination', values)}
              otherValue={data.destination_other}
              onOtherChange={(value) => onChange('destination_other', value)}
              showOtherInput={true}
            />
          </div>

          <div className="question-card">
            <h3 className="question-title">כמה זמן לוקחת משימה בודדת?</h3>
            <div className="radio-group">
              {TIME_ESTIMATES.map((option) => (
                <label key={option.id} className={`radio-option ${data.time_per_task === option.id ? 'selected' : ''}`}>
                  <input
                    type="radio"
                    name="time_per_task"
                    value={option.id}
                    checked={data.time_per_task === option.id}
                    onChange={() => onChange('time_per_task', option.id)}
                  />
                  <span className="radio-circle" />
                  <span className="radio-label">{option.label}</span>
                </label>
              ))}
            </div>
          </div>

          <div className="question-card">
            <h3 className="question-title">כמה פעמים ביום אתה מבצע את התהליך הזה?</h3>
            <input
              type="number"
              className="form-input"
              value={data.tasks_per_day || ''}
              onChange={(e) => onChange('tasks_per_day', e.target.value)}
              placeholder="מספר פעמים ביום"
              min="0"
            />
          </div>

          <div className="question-card">
            <h3 className="question-title">אילו שלבים ידניים יש בתהליך?</h3>
            <p className="question-hint">תאר את השלבים שאתה עושה ידנית (העתקה, הקלדה, המתנה...)</p>
            <textarea
              className="form-textarea"
              value={data.manual_steps || ''}
              onChange={(e) => onChange('manual_steps', e.target.value)}
              placeholder="לדוגמה: מעתיק נתונים מהמייל לאקסל, מחשב סכומים, שולח תשובה..."
              rows="4"
            />
          </div>

          <div className="question-card">
            <h3 className="question-title">כמה כלים/מערכות אתה עובר ביניהם בתהליך?</h3>
            <p className="question-hint">מעבר בין כלים = העתקת מידע ממקום אחד לאחר</p>
            <RadioGroup
              options={['1-2 כלים', '3-4 כלים', '5 כלים ומעלה']}
              value={data.tools_switching_count}
              onChange={(value) => onChange('tools_switching_count', value)}
              name="tools_switching_count"
            />
          </div>
        </>
      );
    }

    function StepFinal({ data, onChange, stepNum, totalSteps }) {
      return (
        <>
          <div className="step-header">
            <div className="step-indicator">שלב {stepNum} מתוך {totalSteps}</div>
            <h2 className="step-title">סיום</h2>
          </div>

          <div className="question-card">
            <h3 className="question-title">משהו נוסף שחשוב לך להוסיף?</h3>
            <p className="question-hint">אופציונלי</p>
            <textarea
              className="form-textarea"
              value={data.additional_notes || ''}
              onChange={(e) => onChange('additional_notes', e.target.value)}
              placeholder="הערות, הצעות, או כל דבר אחר..."
              rows="4"
            />
          </div>
        </>
      );
    }

    function NavigationButtons({ onPrev, onNext, isSubmitting, isLastStep, showPrev }) {
      return (
        <div className="button-group">
          {showPrev && (
            <button className="btn btn-secondary" onClick={onPrev} disabled={isSubmitting}>הקודם</button>
          )}
          <button className="btn btn-primary" onClick={onNext} disabled={isSubmitting}>
            {isSubmitting ? <span className="spinner" /> : isLastStep ? 'שליחה' : 'הבא'}
          </button>
        </div>
      );
    }

    // Main Survey Component
    function Survey() {
      const [step, setStep] = useState(0);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isCompleted, setIsCompleted] = useState(false);
      const [errors, setErrors] = useState({});

      const [formData, setFormData] = useState({
        name: '',
        department: '',
        department_other: '',
        role: '',
        seniority: '',
        activities: [],
        activities_other: '',
        // Department-specific fields
        pda_sender: '',
        pda_sender_other: '',
        is_crew_related: false,
        // Process mapping fields
        info_source: [],
        info_source_other: '',
        data_entry_point: '',
        final_destination_system: '',
        process_type: '',
        process_frequency: '',
        destination: [],
        destination_other: '',
        time_per_task: '',
        tasks_per_day: '',
        manual_steps: '',
        tools_switching_count: '',
        // Email fields
        emails_count: '',
        emails_direct: '',
        emails_action: '',
        emails_copy: '',
        emails_search: '',
        emails_missed: '',
        tools: [],
        tools_other: '',
        internal_system_name: '',
        tools_copy_between: '',
        hours_outside: '',
        most_repeated_action: '',
        biggest_time_waste: '',
        main_frustration: '',
        improvement_idea: '',
        process_wish: '',
        additional_notes: ''
      });

      const updateField = useCallback((field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
        if (errors[field]) {
          setErrors(prev => ({ ...prev, [field]: null }));
        }
      }, [errors]);

      // Calculate steps based on activities
      const hasDynamicQuestions = useMemo(() => {
        return formData.activities.some(a => a !== 'other' && ACTIVITY_QUESTIONS[a]);
      }, [formData.activities]);

      const steps = useMemo(() => {
        const baseSteps = ['welcome', 'personal', 'activities'];
        if (hasDynamicQuestions) {
          baseSteps.push('dynamic');
        }
        baseSteps.push('processmapping', 'emails', 'tools', 'time', 'painpoints', 'final');
        return baseSteps;
      }, [hasDynamicQuestions]);

      const totalSteps = steps.length - 1; // exclude welcome
      const currentStepName = steps[step];
      const currentStepNum = step; // step 0 is welcome, step 1 is first real step

      const progress = useMemo(() => {
        if (step === 0) return 0;
        return (step / totalSteps) * 100;
      }, [step, totalSteps]);

      const validateStep = (stepName) => {
        const newErrors = {};

        if (stepName === 'personal') {
          if (!formData.name.trim()) {
            newErrors.name = 'שדה חובה';
          }
          if (formData.department === 'אחר' && !formData.department_other?.trim()) {
            newErrors.department_other = 'נא לפרט את המחלקה';
          }
        }

        if (stepName === 'painpoints') {
          if (!formData.main_frustration?.trim()) {
            newErrors.main_frustration = 'שדה חובה';
          }
        }

        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const goToStep = (newStep) => {
        setIsTransitioning(true);
        setTimeout(() => {
          setStep(newStep);
          setIsTransitioning(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 300);
      };

      const handleNext = async () => {
        if (!validateStep(currentStepName)) return;

        if (step === steps.length - 1) {
          await submitForm();
        } else {
          goToStep(step + 1);
        }
      };

      const handlePrev = () => {
        if (step > 1) {
          goToStep(step - 1);
        }
      };

      const submitForm = async () => {
        setIsSubmitting(true);

        // Check if Supabase is configured
        if (!isSupabaseConfigured) {
          alert('שגיאת הגדרות: יש להגדיר את פרטי Supabase בקוד.\n\nלמפתחים: יש לעדכן SUPABASE_URL ו-SUPABASE_ANON_KEY');
          setIsSubmitting(false);
          return;
        }

        try {
          const submitData = {
            ...formData,
            activities: formData.activities.length > 0 ? formData.activities : null,
            tools: formData.tools.length > 0 ? formData.tools : null,
            info_source: formData.info_source.length > 0 ? formData.info_source : null,
            destination: formData.destination.length > 0 ? formData.destination : null
          };

          // Clean up empty strings
          Object.keys(submitData).forEach(key => {
            if (submitData[key] === '') submitData[key] = null;
          });

          const response = await fetch(`${SUPABASE_URL}/rest/v1/survey_responses_v2`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify(submitData)
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            console.error('Supabase error:', response.status, errorData);
            throw new Error(errorData.message || errorData.error || `Error ${response.status}`);
          }

          setIsCompleted(true);
        } catch (error) {
          console.error('Submit error:', error);
          alert(`שגיאה: ${error.message}\n\nפתח Console (F12) לפרטים נוספים`);
        } finally {
          setIsSubmitting(false);
        }
      };

      const renderStep = () => {
        if (isCompleted) {
          return <CompletionScreen name={formData.name.split(' ')[0]} />;
        }

        const stepProps = { data: formData, onChange: updateField, errors, stepNum: step, totalSteps };

        switch (currentStepName) {
          case 'welcome':
            return <WelcomeScreen onStart={() => goToStep(1)} />;
          case 'personal':
            return <StepPersonalInfo {...stepProps} />;
          case 'activities':
            return <StepActivities {...stepProps} />;
          case 'dynamic':
            return <StepDynamicQuestions {...stepProps} />;
          case 'processmapping':
            return <StepProcessMapping {...stepProps} />;
          case 'emails':
            return <StepEmails {...stepProps} />;
          case 'tools':
            return <StepTools {...stepProps} />;
          case 'time':
            return <StepTime {...stepProps} />;
          case 'painpoints':
            return <StepPainPoints {...stepProps} />;
          case 'final':
            return <StepFinal {...stepProps} />;
          default:
            return null;
        }
      };

      return (
        <>
          <ProgressBar progress={progress} />
          <Header />
          <main className="survey-container">
            <div className={`step-container ${isTransitioning ? 'step-exiting' : ''}`}>
              {renderStep()}
              {step > 0 && !isCompleted && (
                <NavigationButtons
                  onPrev={handlePrev}
                  onNext={handleNext}
                  isSubmitting={isSubmitting}
                  isLastStep={step === steps.length - 1}
                  showPrev={step > 1}
                />
              )}
            </div>
          </main>
          <footer className="admin-link">
            <a href="admin.html">כניסת מנהלים</a>
          </footer>
        </>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Survey />);
  </script>
</body>
</html>
