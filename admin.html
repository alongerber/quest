    // Kickoff Session Component - תובנות לישיבה
    function KickoffSession({ responses }) {
      const candidates = useMemo(() => {
        return responses
          .map(r => ({
            ...r,
            score: calculateAutomationScore(r),
            weeklyHours: calculateWeeklyHours(r),
            source: (r.info_source || []).map(s => SOURCE_LABELS[s] || s).join(', ') || 'מייל',
            dest: (r.destination || []).map(d => DESTINATION_LABELS[d] || d).join(', ') || 'מערכת פנימית'
          }))
          .sort((a, b) => b.score - a.score)
          .slice(0, 3);
      }, [responses]);

      // Generate truly dynamic insights based on actual data
      const dataInsights = useMemo(() => {
        if (responses.length === 0) return { prompts: [], findings: [] };

        const findings = [];
        const prompts = [];

        // 1. Find most time-consuming department
        const deptHours = {};
        responses.forEach(r => {
          const dept = r.department || r.department_other || 'לא צוין';
          deptHours[dept] = (deptHours[dept] || 0) + calculateWeeklyHours(r);
        });
        const topDept = Object.entries(deptHours).sort((a, b) => b[1] - a[1])[0];
        if (topDept) {
          findings.push(`מחלקת ${topDept[0]} משקיעה הכי הרבה זמן - ${Math.round(topDept[1])} שעות בשבוע`);
          prompts.push(`למה מחלקת ${topDept[0]} עובדת כל כך הרבה? מה אפשר לפשט?`);
        }

        // 2. Find common frustrations
        const frustrations = responses.filter(r => r.main_frustration).map(r => r.main_frustration);
        if (frustrations.length > 0) {
          const sample = frustrations[0].substring(0, 60);
          findings.push(`${frustrations.length} עובדים דיווחו על תסכול בעבודה`);
          prompts.push(`"${sample}..." - איך אפשר לפתור את זה?`);
        }

        // 3. Find tool switching pain
        const highToolSwitch = responses.filter(r =>
          r.tools_switching_count === '5 כלים ומעלה' || r.tools_switching_count === '3-4 כלים'
        );
        if (highToolSwitch.length > 0) {
          findings.push(`${highToolSwitch.length} עובדים עוברים בין הרבה מערכות`);
          prompts.push(`האם אפשר לחבר את המערכות כדי להפחית העתקה ידנית?`);
        }

        // 4. Find email overload
        const highEmail = responses.filter(r => r.emails_count === '50-100' || r.emails_count === 'מעל 100');
        if (highEmail.length > 0) {
          findings.push(`${highEmail.length} עובדים מקבלים מעל 50 מיילים ביום`);
          prompts.push(`איך אפשר לצמצם את כמות המיילים או לסנן אותם?`);
        }

        // 5. Check for copy-paste work
        const copyPaste = responses.filter(r => r.emails_copy === 'רוב' || r.emails_copy === 'כחצי');
        if (copyPaste.length > 0) {
          findings.push(`${copyPaste.length} עובדים מעתיקים מידע ידנית ממיילים`);
          prompts.push(`האם אפשר להזין את המידע אוטומטית במקום להעתיק ידנית?`);
        }

        // 6. Find repetitive tasks
        const repetitive = responses.filter(r => r.process_frequency === 'daily' && r.process_type === 'rule_based');
        if (repetitive.length > 0) {
          findings.push(`${repetitive.length} משימות יומיות שנעשות תמיד באותו אופן`);
          prompts.push(`משימות קבועות שחוזרות כל יום - כדאי לבדוק אם אפשר לייעל`);
        }

        return {
          prompts: prompts.slice(0, 4),
          findings: findings.slice(0, 4)
        };
      }, [responses]);

      if (candidates.length === 0) return null;

      const getScoreClass = (score) => {
        if (score >= 80) return 'score-high';
        if (score >= 50) return 'score-medium';
        return 'score-low';
      };

      const getScoreLabel = (score) => {
        if (score >= 80) return 'מאוד כדאי לייעל';
        if (score >= 50) return 'כדאי לבדוק';
        return 'פחות דחוף';
      };

      return (
        <div className="kickoff-section">
          <div className="kickoff-header">
            <h2 className="kickoff-title">
              סיכום לישיבה
              <span className="kickoff-badge">3 עובדים שכדאי לדבר איתם</span>
            </h2>
          </div>

          <div className="kickoff-grid">
            {candidates.map((candidate, idx) => (
              <div key={candidate.id} className="kickoff-candidate">
                <div className="candidate-header">
                  <div className="candidate-rank">#{idx + 1}</div>
                  <div className={`candidate-score ${getScoreClass(candidate.score)}`}>
                    {getScoreLabel(candidate.score)}
                  </div>
                </div>
                <div className="candidate-name">{candidate.name}</div>
                <div className="candidate-dept">{candidate.department || candidate.department_other || 'לא צוין'} | {candidate.role || 'לא צוין'}</div>

                <div className="candidate-flow">
                  <div className="flow-item">
                    <div className="flow-label">מאיפה מגיע המידע</div>
                    <div className="flow-value">{candidate.source || 'לא צוין'}</div>
                  </div>
                  <div className="flow-arrow">→</div>
                  <div className="flow-item">
                    <div className="flow-label">לאן הוא הולך</div>
                    <div className="flow-value">{candidate.dest || 'לא צוין'}</div>
                  </div>
                </div>

                {candidate.manual_steps && (
                  <div className="flow-item" style={{marginBottom: '0.75rem'}}>
                    <div className="flow-label">מה גוזל הכי הרבה זמן</div>
                    <div className="flow-value" style={{fontSize: '0.8125rem'}}>{candidate.manual_steps.substring(0, 80)}...</div>
                  </div>
                )}

                <div className="candidate-hours">
                  זמן שאפשר לחסוך: <span className="hours-value">{candidate.weeklyHours} שעות בשבוע</span>
                </div>
              </div>
            ))}
          </div>

          {/* Dynamic Findings */}
          {dataInsights.findings.length > 0 && (
            <div className="prompts-section" style={{marginBottom: '1rem'}}>
              <h3 className="prompts-title">
                מה גילינו מהתשובות
              </h3>
              {dataInsights.findings.map((finding, idx) => (
                <div key={idx} className="prompt-item">
                  {finding}
                </div>
              ))}
            </div>
          )}

          {/* Dynamic Questions */}
          {dataInsights.prompts.length > 0 && (
            <div className="prompts-section">
              <h3 className="prompts-title">
                שאלות לדיון (מבוססות על התשובות)
              </h3>
              {dataInsights.prompts.map((prompt, idx) => (
                <div key={idx} className="prompt-item">
                  {idx + 1}. {prompt}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // Bar Chart
    function BarChart({ data, labels, horizontal = false }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (chartRef.current) chartRef.current.destroy();

        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              data: data,
              backgroundColor: CHART_COLORS[0],
              borderRadius: 6
            }]
          },
          options: {
            indexAxis: horizontal ? 'y' : 'x',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }
            },
            scales: {
              x: {
                grid: { display: !horizontal },
                ticks: { font: { family: 'Heebo' } }
              },
              y: {
                grid: { display: horizontal },
                ticks: { font: { family: 'Heebo' } }
              }
            }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [data, labels, horizontal]);

      return <canvas ref={canvasRef}></canvas>;
    }

    // ניתוח מערכתי מתקדם - Analysis Engine Modal
    function AnalysisEngineModal({ responses, onClose, onAnalysisComplete }) {
      const [analysisResponse, setAnalysisResponse] = useState(null);
      const [analysisLoading, setAnalysisLoading] = useState(false);
      const [analysisError, setAnalysisError] = useState(null);

      if (!responses || responses.length === 0) return null;

      // מנוע הניתוח המערכתי
      const runAnalysisEngine = async () => {
        setAnalysisLoading(true);
        setAnalysisError(null);
        try {
          // הכנת נתוני סיכום למנוע הניתוח
          const deptDataSummary = {};
          responses.forEach(r => {
            const dept = r.department || r.department_other || 'לא צוין';
            if (!deptDataSummary[dept]) deptDataSummary[dept] = { count: 0, hours: 0 };
            deptDataSummary[dept].count++;
            deptDataSummary[dept].hours += calculateWeeklyHours(r);
          });

          const deptBreakdown = Object.entries(deptDataSummary)
            .map(([name, data]) => `- ${name}: ${data.count} עובדים, ${Math.round(data.hours)} שעות/שבוע`)
            .join('\n');

          const painPointsSummary = responses
            .filter(r => r.main_frustration)
            .slice(0, 5)
            .map(r => `- ${r.name} (${r.department || 'לא צוין'}): "${r.main_frustration}"`)
            .join('\n') || 'לא דווחו';

          const toolsSummary = {};
          responses.forEach(r => {
            (r.tools || []).forEach(t => { toolsSummary[t] = (toolsSummary[t] || 0) + 1; });
          });
          const toolsList = Object.entries(toolsSummary)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 8)
            .map(([t, c]) => `${t} (${c})`)
            .join(', ') || 'לא צוין';

          const wishesSummary = responses
            .filter(r => r.process_wish || r.automation_wish)
            .slice(0, 5)
            .map(r => `- "${r.process_wish || r.automation_wish}"`)
            .join('\n') || 'לא צוין';

          const summaryData = {
            totalResponses: responses.length,
            totalHours: Math.round(responses.reduce((sum, r) => sum + calculateWeeklyHours(r), 0)),
            avgScore: Math.round(responses.reduce((sum, r) => sum + calculateAutomationScore(r), 0) / responses.length),
            deptBreakdown,
            painPoints: painPointsSummary,
            tools: toolsList,
            wishes: wishesSummary
          };

          const res = await fetch('/.netlify/functions/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ responses, summaryData })
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || 'שגיאה במנוע הניתוח המערכתי');
          }

          setAnalysisResponse(data.analysis);
          if (onAnalysisComplete) {
            onAnalysisComplete(data.analysis);
          }
        } catch (err) {
          console.error('Analysis engine error:', err);
          setAnalysisError(err.message || 'שגיאה בהתחברות למנוע הניתוח');
        } finally {
          setAnalysisLoading(false);
        }
      };

      // Generate comprehensive analysis
      const analysis = useMemo(() => {
        const totalResponses = responses.length;
        const totalHours = responses.reduce((sum, r) => sum + calculateWeeklyHours(r), 0);
        const avgScore = Math.round(responses.reduce((sum, r) => sum + calculateAutomationScore(r), 0) / totalResponses);

        // Department analysis
        const deptData = {};
        responses.forEach(r => {
          const dept = r.department || r.department_other || 'לא צוין';
          if (!deptData[dept]) deptData[dept] = { count: 0, hours: 0, scores: [] };
          deptData[dept].count++;
          deptData[dept].hours += calculateWeeklyHours(r);
          deptData[dept].scores.push(calculateAutomationScore(r));
        });

        const deptAnalysis = Object.entries(deptData)
          .map(([name, data]) => ({
            name,
            count: data.count,
            hours: Math.round(data.hours),
            avgScore: Math.round(data.scores.reduce((a, b) => a + b, 0) / data.scores.length)
          }))
          .sort((a, b) => b.hours - a.hours);

        // Pain points
        const painPoints = responses
          .filter(r => r.main_frustration)
          .map(r => ({ text: r.main_frustration, name: r.name, dept: r.department || r.department_other }));

        // Improvement wishes
        const wishes = responses
          .filter(r => r.process_wish || r.automation_wish)
          .map(r => ({ text: r.process_wish || r.automation_wish, name: r.name }));

        // Tool usage
        const toolUsage = {};
        responses.forEach(r => {
          (r.tools || []).forEach(tool => {
            toolUsage[tool] = (toolUsage[tool] || 0) + 1;
          });
        });
        const topTools = Object.entries(toolUsage).sort((a, b) => b[1] - a[1]).slice(0, 5);

        // Key recommendations
        const recommendations = [];

        if (deptAnalysis[0]?.hours > 20) {
          recommendations.push(`מחלקת ${deptAnalysis[0].name} משקיעה ${deptAnalysis[0].hours} שעות שבועיות - מומלץ לבחון תהליכים לייעול`);
        }

        const highCopyPaste = responses.filter(r => r.emails_copy === 'רוב' || r.emails_copy === 'כחצי').length;
        if (highCopyPaste > totalResponses * 0.3) {
          recommendations.push(`${highCopyPaste} עובדים מעתיקים מידע ממיילים - שווה לבדוק כלי אוטומציה להזנת נתונים`);
        }

        const highEmail = responses.filter(r => r.emails_count === 'מעל 100' || r.emails_count === '50-100').length;
        if (highEmail > 0) {
          recommendations.push(`${highEmail} עובדים מטפלים ביותר מ-50 מיילים ביום - כדאי לבחון סינון וקטגוריזציה`);
        }

        const multiSystem = responses.filter(r => r.tools_switching_count === '5 כלים ומעלה').length;
        if (multiSystem > 0) {
          recommendations.push(`${multiSystem} עובדים עובדים עם 5 מערכות ויותר - אינטגרציה תחסוך זמן`);
        }

        return {
          summary: {
            totalResponses,
            totalHours: Math.round(totalHours),
            avgScore,
            topDept: deptAnalysis[0]
          },
          deptAnalysis,
          painPoints: painPoints.slice(0, 5),
          wishes: wishes.slice(0, 5),
          topTools,
          recommendations
        };
      }, [responses]);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{maxWidth: '900px'}} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">תובנות מערכת - קוראל שירותי ים</h2>
              <button className="modal-close" onClick={onClose}>&times;</button>
            </div>
            <div className="modal-body">
              {/* Summary */}
              <div className="modal-section">
                <h4 className="modal-section-title">מה גילינו?</h4>
                <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '1rem', marginBottom: '1rem'}}>
                  <div style={{background: 'var(--gray-50)', padding: '1rem', borderRadius: '8px', textAlign: 'center'}}>
                    <div style={{fontSize: '2rem', fontWeight: '700', color: 'var(--primary-dark)'}}>{analysis.summary.totalResponses}</div>
                    <div style={{fontSize: '0.875rem', color: 'var(--gray-500)'}}>עובדים ענו</div>
                  </div>
                  <div style={{background: 'var(--gray-50)', padding: '1rem', borderRadius: '8px', textAlign: 'center'}}>
                    <div style={{fontSize: '2rem', fontWeight: '700', color: 'var(--primary-teal)'}}>{analysis.summary.totalHours}</div>
                    <div style={{fontSize: '0.875rem', color: 'var(--gray-500)'}}>שעות עבודה חוזרת בשבוע</div>
                  </div>
                  <div style={{background: 'var(--gray-50)', padding: '1rem', borderRadius: '8px', textAlign: 'center'}}>
                    <div style={{fontSize: '2rem', fontWeight: '700', color: 'var(--success)'}}>{analysis.summary.avgScore}/100</div>
                    <div style={{fontSize: '0.875rem', color: 'var(--gray-500)'}}>פוטנציאל לייעול</div>
                  </div>
                </div>
              </div>

              {/* Department Analysis */}
              <div className="modal-section">
                <h4 className="modal-section-title">פירוט לפי מחלקה</h4>
                <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '0.875rem'}}>
                  <thead>
                    <tr style={{background: 'var(--gray-50)'}}>
                      <th style={{padding: '0.75rem', textAlign: 'right', borderBottom: '1px solid var(--gray-200)'}}>מחלקה</th>
                      <th style={{padding: '0.75rem', textAlign: 'center', borderBottom: '1px solid var(--gray-200)'}}>עובדים שענו</th>
                      <th style={{padding: '0.75rem', textAlign: 'center', borderBottom: '1px solid var(--gray-200)'}}>שעות עבודה חוזרת</th>
                      <th style={{padding: '0.75rem', textAlign: 'center', borderBottom: '1px solid var(--gray-200)'}}>כדאי לייעל?</th>
                    </tr>
                  </thead>
                  <tbody>
                    {analysis.deptAnalysis.map((dept, idx) => (
                      <tr key={idx}>
                        <td style={{padding: '0.75rem', borderBottom: '1px solid var(--gray-100)'}}>{dept.name}</td>
                        <td style={{padding: '0.75rem', textAlign: 'center', borderBottom: '1px solid var(--gray-100)'}}>{dept.count}</td>
                        <td style={{padding: '0.75rem', textAlign: 'center', borderBottom: '1px solid var(--gray-100)', fontWeight: '600', color: 'var(--primary-teal)'}}>{dept.hours}</td>
                        <td style={{padding: '0.75rem', textAlign: 'center', borderBottom: '1px solid var(--gray-100)'}}>{dept.avgScore}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Recommendations */}
              {analysis.recommendations.length > 0 && (
                <div className="modal-section">
                  <h4 className="modal-section-title">המלצות לייעול</h4>
                  <div style={{background: 'linear-gradient(135deg, #059669 0%, #10b981 100%)', borderRadius: '12px', padding: '1.25rem', color: 'white'}}>
                    {analysis.recommendations.map((rec, idx) => (
                      <div key={idx} style={{padding: '0.5rem 0', borderBottom: idx < analysis.recommendations.length - 1 ? '1px solid rgba(255,255,255,0.2)' : 'none'}}>
                        {idx + 1}. {rec}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Pain Points */}
              {analysis.painPoints.length > 0 && (
                <div className="modal-section">
                  <h4 className="modal-section-title">נקודות כאב שזוהו</h4>
                  {analysis.painPoints.map((point, idx) => (
                    <div key={idx} style={{background: 'var(--gray-50)', padding: '0.75rem', borderRadius: '8px', marginBottom: '0.5rem', borderRight: '3px solid var(--warning)'}}>
                      <div style={{fontWeight: '500'}}>"{point.text}"</div>
                      <div style={{fontSize: '0.8125rem', color: 'var(--gray-500)', marginTop: '0.25rem'}}>{point.name} - {point.dept}</div>
                    </div>
                  ))}
                </div>
              )}

              {/* Top Tools */}
              {analysis.topTools.length > 0 && (
                <div className="modal-section">
                  <h4 className="modal-section-title">כלים בשימוש נפוץ</h4>
                  <div style={{display: 'flex', flexWrap: 'wrap', gap: '0.5rem'}}>
                    {analysis.topTools.map(([tool, count], idx) => (
                      <span key={idx} style={{background: 'var(--gray-100)', padding: '0.5rem 1rem', borderRadius: '20px', fontSize: '0.875rem'}}>
                        {tool} ({count})
                      </span>
                    ))}
                  </div>
                </div>
              )}

              {/* מנוע הניתוח המערכתי */}
              <div className="modal-section">
                <h4 className="modal-section-title" style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                  מנוע הניתוח המערכתי
                  <span style={{fontSize: '0.75rem', background: 'linear-gradient(135deg, #0891b2, #1a365d)', color: 'white', padding: '0.125rem 0.5rem', borderRadius: '10px'}}>קוראל</span>
                </h4>

                {!analysisResponse && !analysisLoading && (
                  <div style={{textAlign: 'center', padding: '1.5rem'}}>
                    <p style={{color: 'var(--gray-600)', marginBottom: '1rem'}}>
                      קבל דוח מקיף עם תובנות מערכת והמלצות מבוססות נתונים
                    </p>
                    <button
                      onClick={runAnalysisEngine}
                      style={{
                        background: 'linear-gradient(135deg, #0891b2 0%, #1a365d 100%)',
                        color: 'white',
                        border: 'none',
                        padding: '0.875rem 2rem',
                        borderRadius: '12px',
                        fontSize: '1rem',
                        fontWeight: '600',
                        cursor: 'pointer',
                        fontFamily: 'inherit'
                      }}
                    >
                      הפעל מנוע ניתוח
                    </button>
                    {analysisError && (
                      <p style={{color: 'var(--error)', marginTop: '1rem', fontSize: '0.875rem'}}>{analysisError}</p>
                    )}
                  </div>
                )}

                {analysisLoading && (
                  <div style={{textAlign: 'center', padding: '2rem'}}>
                    <div className="spinner" style={{margin: '0 auto 1rem'}}></div>
                    <p style={{color: 'var(--gray-600)'}}>מנוע הניתוח מעבד את הנתונים...</p>
                  </div>
                )}

                {analysisResponse && (
                  <div style={{
                    background: 'linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%)',
                    borderRadius: '12px',
                    padding: '1.5rem',
                    whiteSpace: 'pre-wrap',
                    lineHeight: '1.8',
                    fontSize: '0.9375rem',
                    color: 'var(--gray-700)',
                    borderRight: '4px solid #8b5cf6'
                  }}>
                    {analysisResponse}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Response Modal
    function ResponseModal({ response, onClose }) {
      if (!response) return null;

      const sections = [
        {
          title: 'פרטים אישיים',
          fields: [
            { label: 'שם', value: response.name },
            { label: 'מחלקה', value: response.department || response.department_other || '-' },
            { label: 'תפקיד', value: response.role || '-' },
            { label: 'ותק', value: response.seniority || '-' },
            { label: 'תאריך מילוי', value: formatDate(response.created_at) }
          ]
        },
        {
          title: 'פעילויות',
          fields: [
            { label: 'פעילויות נבחרות', value: response.activities?.join(', ') || '-' }
          ]
        },
        {
          title: 'מיילים',
          fields: [
            { label: 'מיילים ביום', value: response.emails_count || '-' },
            { label: 'מיילים ישירים', value: response.emails_direct || '-' },
            { label: 'דורשים פעולה', value: response.emails_action || '-' },
            { label: 'דורשים העתקה', value: response.emails_copy || '-' },
            { label: 'חיפוש במייל ישן', value: response.emails_search || '-' },
            { label: 'מיילים נופלים', value: response.emails_missed || '-' }
          ]
        },
        {
          title: 'כלים',
          fields: [
            { label: 'כלים בשימוש', value: response.tools?.join(', ') || '-' },
            { label: 'מערכת פנימית', value: response.internal_system_name || '-' },
            { label: 'העתקות בין כלים', value: response.tools_copy_between || '-', highlight: true }
          ]
        },
        {
          title: 'זמן',
          fields: [
            { label: 'עבודה מחוץ לשעות', value: response.hours_outside || '-' },
            { label: 'פעולה חוזרת', value: response.most_repeated_action || '-', highlight: true },
            { label: 'מבזבז זמן', value: response.biggest_time_waste || '-', highlight: true }
          ]
        },
        {
          title: 'נקודות כאב ורעיונות',
          fields: [
            { label: 'הכי מתסכל', value: response.main_frustration || '-', highlight: true },
            { label: 'רעיון לשיפור', value: response.improvement_idea || '-', highlight: true },
            { label: 'מה הייתם רוצים שישתפר', value: response.process_wish || response.automation_wish || '-', highlight: true },
            { label: 'הערות נוספות', value: response.additional_notes || '-', highlight: true }
          ]
        }
      ];

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">תשובות: {response.name}</h2>
              <button className="modal-close" onClick={onClose}>&times;</button>
            </div>
            <div className="modal-body">
              {sections.map((section, idx) => (
                <div key={idx} className="modal-section">
                  <h4 className="modal-section-title">{section.title}</h4>
                  {section.fields.map((field, fidx) => (
                    <div key={fidx} className="modal-field">
                      <span className="modal-field-label">{field.label}:</span>
                      {field.highlight ? (
                        <span className="modal-field-value highlight">{field.value}</span>
                      ) : (
                        <span className="modal-field-value">{field.value}</span>
                      )}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Main Dashboard Component
    function Dashboard({ onLogout }) {
      const [responses, setResponses] = useState([]);
      const [loading, setLoading] = useState(true);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [departmentFilter, setDepartmentFilter] = useState('');
      const [sortField, setSortField] = useState('created_at');
      const [sortDir, setSortDir] = useState('desc');
      const [currentPage, setCurrentPage] = useState(1);
      const [selectedResponse, setSelectedResponse] = useState(null);
      const [insightsDeptFilter, setInsightsDeptFilter] = useState('');
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [isDeleting, setIsDeleting] = useState(false);
      const [expandedCards, setExpandedCards] = useState({});
      const [viewMode, setViewMode] = useState('table'); // 'table' or 'cards'
      const [showAnalysisEngine, setShowAnalysisEngine] = useState(false);
      const [savedAnalysis, setSavedAnalysis] = useState(localStorage.getItem('coral_analysis') || '');

      const fetchResponses = async () => {
        setLoading(true);
        try {
          const { data, error } = await supabase
            .from('survey_responses_v2')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;
          setResponses(data || []);
          setLastUpdated(new Date());
        } catch (err) {
          console.error('Error fetching responses:', err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchResponses();
      }, []);

      // Delete single response
      const handleDeleteResponse = async () => {
        if (!deleteTarget) return;
        setIsDeleting(true);
        try {
          const { error } = await supabase
            .from('survey_responses_v2')
            .delete()
            .eq('id', deleteTarget.id);

          if (error) throw error;
          setResponses(prev => prev.filter(r => r.id !== deleteTarget.id));
          setDeleteTarget(null);
        } catch (err) {
          console.error('Error deleting response:', err);
          alert('שגיאה במחיקה');
        } finally {
          setIsDeleting(false);
        }
      };

      // Delete all responses
      const handleResetAllData = async () => {
        if (!deleteTarget?.resetAll) return;
        setIsDeleting(true);
        try {
          // Get all IDs first
          const ids = responses.map(r => r.id);
          if (ids.length === 0) {
            setDeleteTarget(null);
            return;
          }

          // Delete in batches to avoid timeout
          for (const id of ids) {
            const { error } = await supabase
              .from('survey_responses_v2')
              .delete()
              .eq('id', id);
            if (error) {
              console.error('Error deleting id:', id, error);
            }
          }

          setResponses([]);
          setDeleteTarget(null);
        } catch (err) {
          console.error('Error resetting data:', err);
          alert('שגיאה באיפוס הנתונים: ' + (err.message || 'נסה שוב'));
        } finally {
          setIsDeleting(false);
        }
      };

      // Toggle card expansion
      const toggleCardExpansion = (id) => {
        setExpandedCards(prev => ({ ...prev, [id]: !prev[id] }));
      };

      // Stats
      const stats = useMemo(() => {
        const total = responses.length;
        const today = responses.filter(r => isToday(r.created_at)).length;
        const week = responses.filter(r => isThisWeek(r.created_at)).length;

        // Calculate total weekly hours potential for automation
        const totalWeeklyHours = responses.reduce((sum, r) => sum + calculateWeeklyHours(r), 0);

        // Calculate average automation score
        const scores = responses.map(r => calculateAutomationScore(r));
        const avgScore = scores.length > 0 ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;

        return { total, today, week, totalWeeklyHours: Math.round(totalWeeklyHours * 10) / 10, avgScore };
      }, [responses]);

      // Chart data
      const chartData = useMemo(() => {
        // Department distribution
        const deptCounts = {};
        responses.forEach(r => {
          const dept = r.department || r.department_other || 'לא צוין';
          deptCounts[dept] = (deptCounts[dept] || 0) + 1;
        });
        const departments = { labels: Object.keys(deptCounts), data: Object.values(deptCounts) };

        // Seniority distribution
        const senCounts = {};
        responses.forEach(r => {
          if (r.seniority) senCounts[r.seniority] = (senCounts[r.seniority] || 0) + 1;
        });
        const seniority = { labels: Object.keys(senCounts), data: Object.values(senCounts) };

        // Emails per day
        const emailCounts = {};
        responses.forEach(r => {
          if (r.emails_count) emailCounts[r.emails_count] = (emailCounts[r.emails_count] || 0) + 1;
        });
        const emails = { labels: Object.keys(emailCounts), data: Object.values(emailCounts) };

        // Activities - with Hebrew labels
        const actCounts = {};
        responses.forEach(r => {
          (r.activities || []).forEach(a => {
            actCounts[a] = (actCounts[a] || 0) + 1;
          });
        });
        const sortedActs = Object.entries(actCounts).sort((a, b) => b[1] - a[1]);
        const activities = {
          labels: sortedActs.map(a => ACTIVITY_LABELS[a[0]] || a[0]),
          data: sortedActs.map(a => a[1])
        };

        // Hours outside
        const hoursCounts = {};
        responses.forEach(r => {
          if (r.hours_outside) hoursCounts[r.hours_outside] = (hoursCounts[r.hours_outside] || 0) + 1;
        });
        const hours = { labels: Object.keys(hoursCounts), data: Object.values(hoursCounts) };

        return { departments, seniority, emails, activities, hours };
      }, [responses]);

      // Filtered and sorted responses
      const filteredResponses = useMemo(() => {
        let result = [...responses];

        if (searchTerm) {
          const term = searchTerm.toLowerCase();
          result = result.filter(r =>
            r.name?.toLowerCase().includes(term) ||
            r.department?.toLowerCase().includes(term) ||
            r.role?.toLowerCase().includes(term)
          );
        }

        if (departmentFilter) {
          result = result.filter(r =>
            r.department === departmentFilter || r.department_other === departmentFilter
          );
        }

        result.sort((a, b) => {
          const aVal = a[sortField] || '';
          const bVal = b[sortField] || '';
          const cmp = aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
          return sortDir === 'asc' ? cmp : -cmp;
        });

        return result;
      }, [responses, searchTerm, departmentFilter, sortField, sortDir]);

      // Pagination
      const totalPages = Math.ceil(filteredResponses.length / ITEMS_PER_PAGE);
      const paginatedResponses = filteredResponses.slice(
        (currentPage - 1) * ITEMS_PER_PAGE,
        currentPage * ITEMS_PER_PAGE
      );

      // Departments list
      const departments = useMemo(() => {
        const depts = new Set();
        responses.forEach(r => {
          if (r.department) depts.add(r.department);
          if (r.department_other) depts.add(r.department_other);
        });
        return Array.from(depts);
      }, [responses]);

      // Pain points and automation wishes
      const insights = useMemo(() => {
        let filtered = responses;
        if (insightsDeptFilter) {
          filtered = filtered.filter(r =>
            r.department === insightsDeptFilter || r.department_other === insightsDeptFilter
          );
        }

        const painPoints = filtered
          .filter(r => r.main_frustration)
          .map(r => ({ text: r.main_frustration, name: r.name, dept: r.department || r.department_other || '-' }));

        const automation = filtered
          .filter(r => r.automation_wish || r.process_wish)
          .map(r => ({ text: r.process_wish || r.automation_wish, name: r.name, dept: r.department || r.department_other || '-' }));

        return { painPoints, automation };
      }, [responses, insightsDeptFilter]);

      // Export to CSV
      const exportToCSV = () => {
        const headers = [
          'תאריך', 'שם', 'מחלקה', 'מחלקה אחר', 'תפקיד', 'ותק',
          'פעילויות', 'מיילים ביום', 'מיילים ישירים', 'דורשים פעולה',
          'דורשים העתקה', 'חיפוש במייל', 'מיילים נופלים',
          'כלים', 'מערכת פנימית', 'העתקות בין כלים',
          'עבודה מחוץ לשעות', 'פעולה חוזרת', 'מבזבז זמן',
          'הכי מתסכל', 'רעיון לשיפור', 'מה הייתם רוצים שישתפר', 'הערות',
          'שולח PDA', 'קשור לצוות', 'נקודת הזנה', 'יעד סופי', 'טרטור בין מערכות', 'מדד עבודה רובוטית'
        ];

        const rows = responses.map(r => [
          formatDate(r.created_at),
          r.name || '',
          r.department || '',
          r.department_other || '',
          r.role || '',
          r.seniority || '',
          (r.activities || []).join('; '),
          r.emails_count || '',
          r.emails_direct || '',
          r.emails_action || '',
          r.emails_copy || '',
          r.emails_search || '',
          r.emails_missed || '',
          (r.tools || []).join('; '),
          r.internal_system_name || '',
          r.tools_copy_between || '',
          r.hours_outside || '',
          r.most_repeated_action || '',
          r.biggest_time_waste || '',
          r.main_frustration || '',
          r.improvement_idea || '',
          r.process_wish || r.automation_wish || '',
          r.additional_notes || '',
          r.pda_sender || '',
          r.is_crew_related ? 'כן' : '',
          r.data_entry_point || '',
          r.final_destination_system || '',
          r.tools_switching_count || '',
          calculateAutomationScore(r)
        ]);

        const csvContent = '\uFEFF' + [headers, ...rows]
          .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
          .join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `survey_responses_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      };

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDir('asc');
        }
      };

      if (loading) {
        return (
          <div className="dashboard">
            <div className="loading">
              <span className="spinner"></span>
              טוען נתונים...
            </div>
          </div>
        );
      }

      return (
        <div className="dashboard">
          <header className="dashboard-header">
            <div className="header-content">
              <h1 className="header-title">מערכת ניתוח תהליכים | קוראל שירותי ים</h1>
              <div className="header-actions">
                {lastUpdated && (
                  <span className="last-updated">
                    עודכן: {lastUpdated.toLocaleTimeString('he-IL')}
                  </span>
                )}
                <button className="btn btn-secondary" onClick={fetchResponses}>רענן נתונים</button>
                <button className="btn btn-primary" onClick={exportToCSV}>ייצוא ל-Excel</button>
                <button className="btn btn-secondary" onClick={() => window.print()}>הדפס דוח מלא</button>
                <button
                  className="btn"
                  style={{background: 'linear-gradient(135deg, #0891b2 0%, #1a365d 100%)', color: 'white'}}
                  onClick={() => setShowAnalysisEngine(true)}
                  disabled={responses.length === 0}
                >
                  תובנות מערכת
                </button>
                <button
                  className="btn btn-danger"
                  onClick={() => setDeleteTarget({ resetAll: true })}
                  disabled={responses.length === 0}
                >
                  איפוס כל הנתונים
                </button>
                <button className="btn btn-logout" onClick={onLogout}>התנתק</button>
              </div>
            </div>
          </header>

          <main className="dashboard-content">
            {/* Executive Print Summary - visible only when printing */}
            {responses.length > 0 && <ExecutivePrintSummary responses={responses} />}

            {/* Data Insights - Professional findings */}
            {responses.length > 0 && <DataInsights responses={responses} />}

            {/* Summary Cards - with context */}
            <div className="summary-cards">
              <SummaryCard label="משיבים לסקר" value={stats.total} />
              <SummaryCard
                label='הערכת זמן "ניירת"'
                value={`כ-${Math.round(stats.totalWeeklyHours)} שע׳/שבוע`}
                secondary={`סה״כ מצטבר (${stats.total} משיבים)`}
              />
              <SummaryCard
                label={LAYMAN_TERMS.frictionScore}
                value={`${stats.avgScore}/100`}
                secondary="ממוצע משוקלל"
              />
            </div>

            {/* Score Explanation */}
            <div style={{background: 'var(--gray-50)', padding: '1rem', borderRadius: '12px', marginBottom: '1.5rem', fontSize: '0.875rem', color: 'var(--gray-600)'}}>
              <strong>איך לקרוא את המספרים:</strong> הנתונים מבוססים על הערכות עצמיות של {stats.total} עובדים שענו על שאלון עם טווחים (למשל: "50-100 מיילים ביום").
              המספרים הם אינדיקציה כללית ולא מדידה מדויקת. <strong>{LAYMAN_TERMS.frictionScore}</strong>: ציון 0-100 המשקלל תדירות משימה + האם יש תבנית קבועה + כמות מערכות. ככל שגבוה יותר = יותר פוטנציאל לייעול.
            </div>

            {/* Practical Tools Guide - Fixed content, always shown */}
            <PracticalToolsGuide />

            {/* Charts */}
            {responses.length > 0 && (
              <div className="charts-grid">
                <ChartCard title="התפלגות לפי מחלקה">
                  <DonutChart data={chartData.departments.data} labels={chartData.departments.labels} />
                </ChartCard>
                <ChartCard title="התפלגות לפי ותק">
                  <BarChart data={chartData.seniority.data} labels={chartData.seniority.labels} horizontal />
                </ChartCard>
                <ChartCard title="עומס מיילים ביום">
                  <BarChart data={chartData.emails.data} labels={chartData.emails.labels} />
                </ChartCard>
                <ChartCard title="פעילויות נפוצות">
                  <BarChart data={chartData.activities.data} labels={chartData.activities.labels} horizontal />
                </ChartCard>
                <ChartCard title="שעות עבודה מחוץ למשרד">
                  <DonutChart data={chartData.hours.data} labels={chartData.hours.labels} />
                </ChartCard>
              </div>
            )}

            {/* Responses Table / Full View */}
            <div className="table-section">
              <div className="table-header">
                <h2 className="table-title">כל התשובות ({filteredResponses.length})</h2>
                <div className="table-filters">
                  <input
                    type="text"
                    className="filter-input"
                    placeholder="חיפוש לפי שם, מחלקה או תפקיד..."
                    value={searchTerm}
                    onChange={e => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                  />
                  <select
                    className="filter-select"
                    value={departmentFilter}
                    onChange={e => { setDepartmentFilter(e.target.value); setCurrentPage(1); }}
                  >
                    <option value="">כל המחלקות</option>
                    {departments.map(dept => (
                      <option key={dept} value={dept}>{dept}</option>
                    ))}
                  </select>
                  <button
                    className={`btn ${viewMode === 'table' ? 'btn-primary' : 'btn-secondary'}`}
                    onClick={() => setViewMode('table')}
                  >
                    טבלה
                  </button>
                  <button
                    className={`btn ${viewMode === 'cards' ? 'btn-primary' : 'btn-secondary'}`}
                    onClick={() => setViewMode('cards')}
                  >
                    כרטיסים מפורטים
                  </button>
                </div>
              </div>

              {filteredResponses.length === 0 ? (
                <div className="empty-state">אין תשובות להצגה</div>
              ) : viewMode === 'cards' ? (
                /* Cards View */
                <div>
                  {paginatedResponses.map(response => (
                    <ResponseCard
                      key={response.id}
                      response={response}
                      onDelete={setDeleteTarget}
                      onExpand={toggleCardExpansion}
                      isExpanded={expandedCards[response.id]}
                    />
                  ))}
                  {totalPages > 1 && (
                    <div className="pagination">
                      <button
                        className="pagination-btn"
                        onClick={() => setCurrentPage(p => p - 1)}
                        disabled={currentPage === 1}
                      >
                        הקודם
                      </button>
                      <span className="pagination-info">עמוד {currentPage} מתוך {totalPages}</span>
                      <button
                        className="pagination-btn"
                        onClick={() => setCurrentPage(p => p + 1)}
                        disabled={currentPage === totalPages}
                      >
                        הבא
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                /* Table View */
                <>
                  <div className="table-wrapper">
                    <table className="data-table">
                      <thead>
                        <tr>
                          <th onClick={() => handleSort('created_at')}>תאריך {sortField === 'created_at' && (sortDir === 'asc' ? '↑' : '↓')}</th>
                          <th onClick={() => handleSort('name')}>שם {sortField === 'name' && (sortDir === 'asc' ? '↑' : '↓')}</th>
                          <th onClick={() => handleSort('department')}>מחלקה {sortField === 'department' && (sortDir === 'asc' ? '↑' : '↓')}</th>
                          <th onClick={() => handleSort('role')}>תפקיד {sortField === 'role' && (sortDir === 'asc' ? '↑' : '↓')}</th>
                          <th title="ככל שהמספר גבוה יותר, יש יותר פוטנציאל לייעול">כדאי לייעל?</th>
                          <th onClick={() => handleSort('emails_count')}>מיילים ביום {sortField === 'emails_count' && (sortDir === 'asc' ? '↑' : '↓')}</th>
                          <th>פעולות</th>
                        </tr>
                      </thead>
                      <tbody>
                        {paginatedResponses.map(response => {
                          const score = calculateAutomationScore(response);
                          const badgeColor = getScoreBadgeColor(score);
                          return (
                            <tr key={response.id}>
                              <td onClick={() => setSelectedResponse(response)}>{formatShortDate(response.created_at)}</td>
                              <td onClick={() => setSelectedResponse(response)}>{response.name}</td>
                              <td onClick={() => setSelectedResponse(response)}>{response.department || response.department_other || '-'}</td>
                              <td onClick={() => setSelectedResponse(response)}>{response.role || '-'}</td>
                              <td onClick={() => setSelectedResponse(response)} title={`ציון: ${score}/100`}>
                                <span className="score-badge" style={{ background: badgeColor.bg, color: badgeColor.color }}>
                                  {badgeColor.label}
                                </span>
                              </td>
                              <td onClick={() => setSelectedResponse(response)}>{response.emails_count || '-'}</td>
                              <td>
                                <button
                                  className="delete-btn"
                                  onClick={() => setDeleteTarget(response)}
                                >
                                  מחק
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {totalPages > 1 && (
                    <div className="pagination">
                      <button
                        className="pagination-btn"
                        onClick={() => setCurrentPage(p => p - 1)}
                        disabled={currentPage === 1}
                      >
                        הקודם
                      </button>
                      <span className="pagination-info">עמוד {currentPage} מתוך {totalPages}</span>
                      <button
                        className="pagination-btn"
                        onClick={() => setCurrentPage(p => p + 1)}
                        disabled={currentPage === totalPages}
                      >
                        הבא
                      </button>
                    </div>
                  )}
                </>
              )}
            </div>


            {/* Meeting Legend - shown in print */}
            <MeetingLegend />

            {/* Analysis Engine Print Section - appears only when printing if analysis was run */}
            {savedAnalysis && (
              <div className="ai-analysis-print">
                <h2 className="ai-analysis-print-title">
                  דוח ניתוח מערכתי - קוראל שירותי ים
                </h2>
                <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.8', fontSize: '0.9rem'}}>
                  {savedAnalysis}
                </div>
              </div>
            )}
          </main>

          {/* Response Modal */}
          {selectedResponse && (
            <ResponseModal response={selectedResponse} onClose={() => setSelectedResponse(null)} />
          )}

          {/* Analysis Engine Modal */}
          {showAnalysisEngine && (
            <AnalysisEngineModal
              responses={responses}
              onClose={() => setShowAnalysisEngine(false)}
              onAnalysisComplete={(analysis) => {
                setSavedAnalysis(analysis);
                localStorage.setItem('coral_analysis', analysis);
              }}
            />
          )}

          {/* Delete Confirmation Dialog */}
          {deleteTarget && (
            <ConfirmDialog
              title={deleteTarget.resetAll ? 'איפוס כל הנתונים' : `מחיקת תשובה של ${deleteTarget.name}`}
              message={deleteTarget.resetAll
                ? 'האם אתה בטוח שברצונך למחוק את כל התשובות? פעולה זו בלתי הפיכה!'
                : 'האם אתה בטוח שברצונך למחוק תשובה זו?'
              }
              onConfirm={deleteTarget.resetAll ? handleResetAllData : handleDeleteResponse}
              onCancel={() => setDeleteTarget(null)}
              isDeleting={isDeleting}
            />
          )}
        </div>
      );
    }

    // Config Error Component
    function ConfigError() {
      return (
        <div className="login-screen">
          <div className="login-card">
            <h1 className="login-title" style={{color: '#dc2626'}}>שגיאת הגדרות</h1>
            <p className="login-subtitle">יש להגדיר את פרטי Supabase בקוד</p>
            <div style={{background: '#f1f5f9', padding: '1rem', borderRadius: '8px', textAlign: 'left', direction: 'ltr', fontSize: '0.875rem', fontFamily: 'monospace'}}>
              <p>const SUPABASE_URL = '<span style={{color: '#dc2626'}}>your-url</span>';</p>
              <p>const SUPABASE_ANON_KEY = '<span style={{color: '#dc2626'}}>your-key</span>';</p>
            </div>
            <p style={{marginTop: '1rem', fontSize: '0.875rem', color: '#64748b'}}>
              ניתן להשיג את הפרטים מ-Supabase Dashboard → Settings → API
            </p>
          </div>
        </div>
      );
    }

    // App Component
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(
        localStorage.getItem('admin_authenticated') === 'true'
      );

      const handleLogout = () => {
        localStorage.removeItem('admin_authenticated');
        setIsAuthenticated(false);
      };

      // Show config error if Supabase not configured
      if (!isSupabaseConfigured) {
        return <ConfigError />;
      }

      if (!isAuthenticated) {
        return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
      }

      return <Dashboard onLogout={handleLogout} />;
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
